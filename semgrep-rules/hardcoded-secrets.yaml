rules:
  - id: ai-hardcoded-secret-env-var
    patterns:
      - pattern-either:
          - pattern: |
              $VAR = "..."
          - pattern: |
              $VAR = '...'
      - pattern-regex: (?:api.?key|secret|password|token|credential)
    message: >
      Hardcoded secret or credential detected. Use environment variables
      or a secrets manager (e.g., GitHub Secrets, AWS Secrets Manager) instead.
    severity: ERROR
    languages:
      - javascript
      - typescript
      - python
      - go
      - java
      - ruby
    metadata:
      category: security
      technology:
        - ai-code-guard
      cwe: "CWE-798: Use of Hard-coded Credentials"
      confidence: MEDIUM
